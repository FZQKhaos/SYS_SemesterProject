# Fluentd-sidecar: læser Dockers logfiler for Profile-servicen og skriver dem til egen stdout.

# SOURCE: hvor kommer logs fra?
# Docker (json-file driver) gemmer hver containers stdout som <container-id>-json.log
<source>
  @type tail
  path /fluentd/log/containers/*/*.log
  # pos_file husker, hvor langt i filen vi er kommet
  pos_file /fluentd/log/fluentd-docker.pos
  # læs også det, der allerede er skrevet, så vi ikke misser opstartslogs
  read_from_head true
  tag docker.*
  <parse>
    # hver linje er JSON: {"log":"...","stream":"stdout","attrs":{...},"time":"..."}
    @type json
    # brug Dockers tidsstempel som logbeskedens tid
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%N%z
  </parse>
</source>

# FILTER: behold kun logs fra containere med label logsource=profile
<filter docker.**>
  @type grep
  <regexp>
    key $.attrs.logsource
    pattern /^profile$/
  </regexp>
</filter>

# FILTER: "log"-feltet indeholder appens JSON-linje som tekst. Pak den ud til rigtige felter
# (LogLevel, Category, Message ...), så de kan søges og filtreres i Kibana.
<filter docker.**>
  @type parser
  key_name log
  # behold de øvrige felter (stream, attrs)
  reserve_data true
  <parse>
    @type json
  </parse>
</filter>

# MATCH: hvor skal logs hen? Både konsollen og Elasticsearch (det centrale system)
<match **>
  # copy sender hver log til flere destinationer
  @type copy

  <store>
    @type stdout
  </store>

  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    # logstash_format giver daglige indekser: bizcord-logs-YYYY.MM.DD
    logstash_format true
    logstash_prefix bizcord-logs
    # prøv igen, hvis Elasticsearch ikke er klar endnu
    reconnect_on_error true
    reload_on_failure true
    <buffer>
      flush_interval 5s
    </buffer>
  </store>
</match>
